<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Clean Icon -->
  <rect x="2" y="6" width="28" height="28" rx="6" fill="url(#gradient1-dark)" filter="url(#shadow-dark)"/>
  
  <!-- Simple "L" letter in the icon -->
  <path d="M8 12 L8 26 L20 26 L20 23 L11 23 L11 12 Z" fill="white" stroke="none"/>
  
  <!-- Clear, Bold Text for Dark Mode -->
  <text x="38" y="18" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="18" 
        font-weight="800" 
        fill="#f9fafb" 
        letter-spacing="-0.5px">Laravel</text>
  
  <text x="38" y="30" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
